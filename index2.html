<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIAT Fica</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #c8c8c8;
        --accent: #c62828;
        --slide-speed: 0.75s;
      }

      body {
        font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }
      .container {
        max-width: 100%;
        margin: 0 auto;
        padding: 0 clamp(16px, 4vw, 50px);
      }

      /* ── Hero ── */
      .hero {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(40px, 8vw, 100px);
      }

      /* ── FIAT Logo (SVG from user) ── */
      .fiat-logo {
        position: absolute;
        top: clamp(20px, 3vw, 42px);
        left: clamp(16px, 4vw, 50px);
        z-index: 10;
      }

      .fiat-logo svg {
        width: clamp(40px, 4vw, 60px);
        height: auto;
      }

      /* ── Giant Background Text ── */
      .big-text {
        position: absolute;
        font-family: "Anton", sans-serif;
        font-size: clamp(100px, 30vw, 580px);
        line-height: 0.85;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        user-select: none;
        z-index: 1;
        color: var(--accent);
        transition: color 0.6s ease;
      }

      /* ── Car Track ── */
      .car-track {
        position: relative;
        z-index: 2;
        width: clamp(280px, 65vw, 937px);
        overflow: hidden;
        margin-top: clamp(80px, 15vw, 280px);
      }

      .car-slider {
        display: flex;
        transition: transform var(--slide-speed) cubic-bezier(0.65, 0, 0.35, 1);
      }

      .car-slide {
        min-width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
      }

      .car-slide img {
        width: 100%;
        height: auto;
        object-fit: contain;
        display: block;
      }

      /* ── Bottom Bar: arrows + description in a row ── */
      .bottom-bar {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 40px;
        z-index: 100;
        width: 100%;
      }

      .description {
        font-size: clamp(14px, 1.6vw, 25px);
        width: 35%;
        min-width: 200px;
        color: #fff;
        text-align: center;
      }

      /* ── Arrow Navigation ── */
      .nav-arrows {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-shrink: 0;
      }

      .nav-arrow {
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 0.2s ease,
          opacity 0.2s ease;
        opacity: 0.7;
      }

      .nav-arrow:hover {
        opacity: 1;
        transform: translateX(-4px);
      }

      .nav-arrow.next:hover {
        transform: translateX(4px);
      }

      .nav-arrow:active {
        transform: scale(0.92);
      }

      .nav-arrow svg {
        height: clamp(20px, 3vw, 36px);
        width: auto;
      }

      .nav-arrow.next svg {
        transform: scaleX(-1);
        size: 200px;
      }

      /* ── Progress line ── */
      .progress-track {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: rgba(0, 0, 0, 0.06);
        z-index: 100;
      }

      .progress-bar {
        height: 100%;
        width: 50%;
        background: #444;
        transition: width 0.5s ease;
      }

      /* ── Grain ── */
      .grain {
        position: fixed;
        inset: 0;
        z-index: 999;
        pointer-events: none;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 200px 200px;
      }

      .vignette {
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          transparent 55%,
          rgba(0, 0, 0, 0.05) 100%
        );
      }

      /* ── Load animations ── */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes driveIn {
        from {
          opacity: 0;
          transform: translateX(100px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .fiat-logo {
        animation: fadeIn 0.6s 0.1s both;
      }
      .big-text {
        animation: fadeUp 0.7s 0.2s both;
      }
      .car-track {
        animation: driveIn 0.9s 0.3s both;
      }
      .bottom-bar {
        animation: fadeUp 0.6s 0.5s both;
      }

      /* ── Tablet ── */
      @media (max-width: 1024px) {
        .hero {
          gap: clamp(30px, 5vw, 60px);
        }
        .car-track {
          width: 80vw;
          margin-top: clamp(60px, 12vw, 200px);
        }
        .bottom-bar {
          gap: 20px;
        }
      }

      /* ── Mobile ── */
      @media (max-width: 640px) {
        .hero {
          gap: 30px;
          justify-content: flex-start;
          padding-top: 15vh;
        }
        .car-track {
          width: 90vw;
          margin-top: clamp(40px, 10vw, 120px);
        }
        .car-slide {
          padding: 0 8px;
        }
        .bottom-bar {
          gap: 12px;
        }
        .description {
          width: auto;
          min-width: 0;
          flex: 1;
        }
        .nav-arrow {
          padding: 4px;
        }
      }
    </style>
  </head>
  <body>
    <div class="hero container">
      <!-- FIAT Logo -->
      <div class="fiat-logo">
        <svg viewBox="0 0 60 37" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M43.656 4.659H48.396L48.261 36.924H54.066L55.299 4.653H60L59.964 0H43.656V4.659ZM22.38 0H15.522L16.257 36.924H22.26L22.38 0ZM39 0H25.569L26.076 36.921H31.632L31.695 21.654H38.352C38.8608 26.7265 39.0882 31.8233 39.033 36.921H44.433C44.931 18.072 43.353 7.419 39 0ZM31.443 17.1L31.509 4.56H34.86C36.7092 8.50378 37.8147 12.755 38.121 17.1H31.443ZM0 0L1.194 36.924H7.008L6.879 21.612H11.754V16.839H6.879L6.897 4.824H13.26L13.227 0H0Z"
            fill="black"
          />
        </svg>
      </div>

      <!-- Big FICA text -->
      <div class="big-text" id="bigText">FIĆA</div>

      <!-- Car slider -->
      <div class="car-track">
        <div class="car-slider" id="carSlider">
          <div class="car-slide">
            <img src="car1.png" alt="Plava Fica" />
          </div>
          <div class="car-slide">
            <img src="car2.png" alt="Crvena Fica" />
          </div>
          <div class="car-slide">
            <img src="car2.png" alt="Crvena Fica" />
          </div>
        </div>
      </div>

      <!-- Bottom bar: arrow - description - arrow -->
      <div class="bottom-bar">
        <button class="nav-arrow prev" id="prevBtn" aria-label="Previous">
          <svg
            viewBox="0 0 100 53"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M99.4297 24.4262L2.42969 24.4262M2.42969 24.4262L34.2656 51.2119M2.42969 24.4262L34.2656 1.21191"
              stroke="#fff"
              stroke-width="3"
            />
          </svg>
        </button>

        <div class="description">
          Otkij pricu o najpoznatijem jugoslovenskom automobilu, simbolu
          slobode, zajednistva i nezaboravnih putovanja.
        </div>

        <button class="nav-arrow next" id="nextBtn" aria-label="Next">
          <svg
            viewBox="0 0 100 53"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M99.4297 24.4262L2.42969 24.4262M2.42969 24.4262L34.2656 51.2119M2.42969 24.4262L34.2656 1.21191"
              stroke="#fff"
              stroke-width="3"
            />
          </svg>
        </button>
      </div>

      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="vignette"></div>
    </div>

    <div class="grain"></div>

    <script>
      const slider = document.getElementById("carSlider");
      const bigText = document.getElementById("bigText");
      const progressBar = document.getElementById("progressBar");
      const totalSlides = 3;
      let current = 0;
      let isAnimating = false;

      const accentColors = ["#6a8fa7", "#c62828"];

      function update() {
        slider.style.transform = `translateX(-${current * 100}%)`;
        progressBar.style.width = ((current + 1) / totalSlides) * 100 + "%";
        bigText.style.color = accentColors[current];
      }

      function goNext() {
        if (isAnimating) return;
        isAnimating = true;
        current = (current + 1) % totalSlides;
        update();
        setTimeout(() => (isAnimating = false), 800);
      }

      function goPrev() {
        if (isAnimating) return;
        isAnimating = true;
        current = (current - 1 + totalSlides) % totalSlides;
        update();
        setTimeout(() => (isAnimating = false), 800);
      }

      document.getElementById("nextBtn").addEventListener("click", goNext);
      document.getElementById("prevBtn").addEventListener("click", goPrev);

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") goNext();
        if (e.key === "ArrowLeft") goPrev();
      });

      update();
    </script>
  </body>
</html>
